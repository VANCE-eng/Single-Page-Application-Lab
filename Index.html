<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WORDLY DICTIONARY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="mx-auto max-w-2xl px-4 py-12">
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-bold text-indigo-700">WORDLY DICTIONARY</h1>
      <p class="mt-2 text-slate-600">Find a word, hear it, and save it for later.</p>
    </header>

    <form id="search-form" class="flex gap-2">
      <label class="sr-only" for="word-input">Word to search</label>
      <input id="word-input"
             class="min-w-0 flex-1 rounded-lg border border-slate-300 px-4 py-3"
             type="search" placeholder="Enter a word" autocomplete="off">
      <button class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-700"
              type="submit">Search</button>
    </form>

    <p id="message" class="mt-4" role="status" aria-live="polite"></p>
    <section id="result" class="mt-6" aria-label="Word result"></section>

    <section class="mt-10">
      <h2 class="text-xl font-bold">Saved words</h2>
      <ul id="saved-words" class="mt-3 space-y-2"></ul>
    </section>
  </main>
</body>
</html>
